trigger:
  branches:
    include:
      - main
      - rama-Hybrida

pr:
  branches:
    include:
      - main
      - rama-Hybrida

resources:
  containers:
  - container: odinci
    image: ghcr.io/joselocelis/odin-ci:latest

jobs:
- job: Test
  displayName: 'Test ODIN'
  pool:
    vmImage: 'ubuntu-24.04'
  container: odinci

  steps:
  - script: |
      flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,src/data,.kiro
      flake8 . --count --max-line-length=127 --statistics --exit-zero --exclude=.git,__pycache__,src/data,.kiro
    displayName: 'Validar Estilo de Código (Flake8)'

  - script: |
      xvfb-run --server-args="-screen 0 1024x768x24" python -m pytest tests -v
    displayName: 'Ejecutar Suite de Pruebas (PyTest + GTK4 en Xvfb)'
