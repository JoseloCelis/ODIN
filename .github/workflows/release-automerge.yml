name: Auto-merge del PR de release

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    # Solo el PR que abre release-please en la rama de release
    if: startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    steps:
      - name: Habilitar auto-merge (squash) al quedar los checks en verde
        env:
          # Debe ser un PAT, no github.token: un merge hecho con GITHUB_TOKEN no
          # dispara workflows, y el push a main tiene que disparar Release-Please
          # para crear el tag y la release. Con GITHUB_TOKEN el PR se mergea y
          # la version queda sin tag ni release, en silencio.
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto --squash
