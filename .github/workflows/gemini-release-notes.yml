name: Gemini Release Notes

on:
  workflow_run:
    workflows:
      - Release-Please
    types:
      - completed
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to regenerate (empty: latest release)"
        required: false
        type: string
      models:
        description: "Comma-separated model fallback order"
        required: false
        type: string
        default: "gemini-3.5-flash-lite,gemini-flash-lite-latest"

jobs:
  generate-notes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_MODELS: ${{ inputs.models || 'gemini-3.5-flash-lite,gemini-flash-lite-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          fi

          if [ -z "$TAG" ]; then
            echo "No release tag found; skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Get commits since previous tag
        if: steps.tag.outputs.skip != 'true'
        id: commits
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s (%h)" > commits.txt
          else
            git log --pretty=format:"- %s (%h)" -n 50 > commits.txt
          fi
          cat commits.txt

      - name: Generate release notes with Gemini
        if: steps.tag.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          COMMITS_JSON=$(jq -Rs . < commits.txt)
          IFS=',' read -ra MODEL_LIST <<< "$GEMINI_MODELS"
          SUCCESS=false

          for MODEL in "${MODEL_LIST[@]}"; do
            MODEL=$(printf '%s' "$MODEL" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
            [ -z "$MODEL" ] && continue
            echo "Trying model: $MODEL"

            PAYLOAD=$(jq -n \
              --arg tag "$TAG" \
              --argjson commits "$COMMITS_JSON" \
              '{
                systemInstruction: {
                  parts: [{
                    text: "Eres el redactor técnico experto de notas del release del proyecto. Escribe en español mexicano neutro y profesional. Respondés únicamente con Markdown válido el cual se publicará tal cual como cuerpo de la release en GitHub. No agregás introducciones, aclaraciones, disclaimers, ni cierres. No dices frases como: «aquí tienes» o «a continuación». No mencionás el modelo de IA que redactó el texto ni el proceso de generación. No envuelves la respuesta en bloques de código. No inventás cambios que no figuren en los commits."
                  }]
                },
                contents: [{
                  role: "user",
                  parts: [{
                    text: ("Versión: " + $tag + "\n\nCommits (asunto y hash):\n" + $commits + "\n\nRedactá las notas con esta estructura exacta: ## Resumen, ## Nuevas funcionalidades, ## Correcciones de errores o bugs, ## Otros cambios. Usá viñetas concisas y omite las secciones que no apliquen. Empieza directamente con ## Resumen.")
                  }]
                }],
                generationConfig: {
                  temperature: 0.2
                }
              }')

            HTTP_CODE=$(curl -sS -o gemini_response.json -w '%{http_code}' \
              "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "$PAYLOAD")

            TEXT=$(jq -r '.candidates[0].content.parts[0].text // empty' gemini_response.json 2>/dev/null || true)

            if [ "$HTTP_CODE" = "200" ] && [ -n "$TEXT" ] && [ "$TEXT" != "null" ]; then
              # Descarta preámbulos y verjas de código; conserva desde el primer título.
              printf '%s\n' "$TEXT" \
                | sed -E 's/^[[:space:]]*```(markdown|md)?[[:space:]]*$//' \
                | awk 'inicio == 0 && /^#{1,3}[[:space:]]/ { inicio = 1 } inicio == 1 { print }' \
                > release_notes.md

              if [ -s release_notes.md ]; then
                echo "Selected model: $MODEL"
                echo "--- Generated release notes ---"
                cat release_notes.md
                SUCCESS=true
                break
              fi

              echo "Model $MODEL returned text without Markdown headings; discarding."
              rm -f release_notes.md
            fi

            ERROR_MESSAGE=$(jq -r '.error.message // .error.status // "no candidates in response"' gemini_response.json 2>/dev/null || echo "invalid JSON response")
            echo "Model $MODEL failed (HTTP $HTTP_CODE): $ERROR_MESSAGE"
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Gemini did not produce release notes for any configured model; release will not be edited."
            exit 1
          fi

      - name: Update GitHub release with notes
        if: steps.tag.outputs.skip != 'true'
        run: |
          if [ ! -s release_notes.md ]; then
            echo "release_notes.md is empty or missing; refusing to edit the release."
            exit 1
          fi
          TAG="${{ steps.tag.outputs.tag }}"
          gh release edit "$TAG" --notes-file release_notes.md
          echo "Release $TAG updated with Gemini-generated notes."
