name: Gemini Release Notes

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to regenerate (empty: latest release)"
        required: false
        type: string
      models:
        description: "Comma-separated model fallback order"
        required: false
        type: string
        default: "gemini-3.5-flash-lite,gemini-flash-lite-latest"

jobs:
  generate-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_MODELS: ${{ inputs.models || 'gemini-3.5-flash-lite,gemini-flash-lite-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          fi

          if [ -z "$TAG" ]; then
            echo "No release tag found; skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Get commits since previous tag
        if: steps.tag.outputs.skip != 'true'
        id: commits
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s (%h)" > commits.txt
          else
            git log --pretty=format:"- %s (%h)" -n 50 > commits.txt
          fi
          cat commits.txt

      - name: Generate release notes with Gemini
        if: steps.tag.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          COMMITS_JSON=$(jq -Rs . < commits.txt)
          IFS=',' read -ra MODEL_LIST <<< "$GEMINI_MODELS"
          SUCCESS=false

          for MODEL in "${MODEL_LIST[@]}"; do
            MODEL=$(printf '%s' "$MODEL" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
            [ -z "$MODEL" ] && continue
            echo "Trying model: $MODEL"

            PAYLOAD=$(jq -n \
              --arg tag "$TAG" \
              --argjson commits "$COMMITS_JSON" \
              '{
                systemInstruction: {
                  parts: [{
                    text: "Eres un Ingeniero de Software Senior y Technical Writer experto en documentación de productos y gestión de versiones (Semantic Versioning y Keep a Changelog). Transformás listas de commits, Pull Requests o notas técnicas crudas en Release Notes profesionales, claras y orientadas al usuario final.\n\nReglas estrictas de redacción:\n1. Enfoque en el impacto, no en el código: traduce cambios técnicos internos en beneficios o consecuencias claras para el usuario.\n2. Agrupación inteligente: fusiona commits pequeños que resuelvan el mismo problema o formen parte de la misma función en un punto cohesivo.\n3. Filtro de ruido: omite commits triviales como wip, fix typo, format, merge branch, cambios menores de linter y actualizaciones de pruebas internas, salvo que afecten al usuario.\n4. Breaking Changes: si detectas BREAKING CHANGE, un símbolo de exclamación como feat!: o cambios en firmas o APIs públicas, muévelos obligatoriamente a ## ⚠️ Breaking Changes y explica cómo migrar.\n5. Tono: profesional, directo, técnico pero accesible, sin relleno ni adjetivos exagerados.\n6. Trazabilidad: cada punto debe derivarse de los commits o PRs de entrada; no inventes cambios, PRs ni hashes sin evidencia.\n7. Publicación directa: respondés únicamente con Markdown válido que se publicará tal cual como cuerpo de la release. Sin introducciones, aclaraciones, disclaimers ni cierres; sin frases como «aquí tienes» o «a continuación»; sin mencionar el modelo de IA ni el proceso de generación; sin bloques de código.\n\nEstructura obligatoria, empieza directamente con ## Resumen y omite las categorías que queden vacías:\n## Resumen (párrafo de 2 a 3 líneas)\n## ⚠️ Breaking Changes\n## 🗑️ Cambios Eliminados\n## 🚀 Nuevas Funcionalidades\n## ⚡ Mejoras y Rendimiento\n## 🐛 Corrección de Errores\n## 🔒 Seguridad\n## 🔧 Mantenimiento y Otros Cambios\nCada bullet describe el beneficio, el problema o la mejora, y añade (#PR o hash) si está disponible."
                  }]
                },
                contents: [{
                  role: "user",
                  parts: [{
                    text: ("Versión / Tag: " + $tag + "\nIdioma de salida: Español\n\nCommits / PRs (asunto y hash):\n" + $commits)
                  }]
                }],
                generationConfig: {
                  temperature: 0.2
                }
              }')

            HTTP_CODE=$(curl -sS -o gemini_response.json -w '%{http_code}' \
              "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "$PAYLOAD")

            TEXT=$(jq -r '.candidates[0].content.parts[0].text // empty' gemini_response.json 2>/dev/null || true)

            if [ "$HTTP_CODE" = "200" ] && [ -n "$TEXT" ] && [ "$TEXT" != "null" ]; then
              # Descarta preámbulos y verjas de código; conserva desde el primer título.
              printf '%s\n' "$TEXT" \
                | sed -E 's/^[[:space:]]*```(markdown|md)?[[:space:]]*$//' \
                | awk 'inicio == 0 && /^#{1,3}[[:space:]]/ { inicio = 1 } inicio == 1 { print }' \
                > release_notes.md

              HEADINGS=$(grep -c '^## ' release_notes.md || true)
              BYTES=$(wc -c < release_notes.md)
              if [ "$HEADINGS" -ge 2 ] && [ "$BYTES" -ge 200 ]; then
                echo "Selected model: $MODEL"
                echo "--- Generated release notes ---"
                cat release_notes.md
                SUCCESS=true
                break
              fi

              echo "Model $MODEL returned insufficient notes (headings=$HEADINGS bytes=$BYTES); discarding."
              rm -f release_notes.md
            fi

            ERROR_MESSAGE=$(jq -r '.error.message // .error.status // "no candidates in response"' gemini_response.json 2>/dev/null || echo "invalid JSON response")
            echo "Model $MODEL failed (HTTP $HTTP_CODE): $ERROR_MESSAGE"
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Gemini did not produce release notes for any configured model; release will not be edited."
            exit 1
          fi

      - name: Update GitHub release with notes
        if: steps.tag.outputs.skip != 'true'
        run: |
          if [ ! -s release_notes.md ]; then
            echo "release_notes.md is empty or missing; refusing to edit the release."
            exit 1
          fi
          TAG="${{ steps.tag.outputs.tag }}"
          gh release edit "$TAG" --notes-file release_notes.md
          echo "Release $TAG updated with Gemini-generated notes."
