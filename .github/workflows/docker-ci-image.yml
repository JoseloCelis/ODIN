name: Build & Publish CI Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rama-Hybrida
    paths:
      - 'Dockerfile.ci'
      - 'requirements.txt'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar y publicar imagen de CI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: |
            ghcr.io/joselocelis/odin-ci:latest
            ghcr.io/joselocelis/odin-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
